name: Jalaa
options:
  bundleIdPrefix: com.faalotaibi
  deploymentTarget:
    iOS: '17.0'
targets:
  Jalaa:
    type: application
    platform: iOS
    sources:
      - path: Jalaa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faalotaibi.jalaa
        PRODUCT_NAME: Jalaa
        SWIFT_VERSION: 5.0
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: جلاء
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
