name: Build GeoShift v7.1 Proxy Preflight IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - source-v4/**
      - v4_hotfix.py
      - v71_proxy_preflight.py
      - .github/workflows/build-geoshift-ipa.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Reconstruct v4 source
        run: |
          cat source-v4/part-01.txt source-v4/part-02.txt source-v4/part-03.txt source-v4/part-04.txt source-v4/part-05.txt source-v4/part-06-0.txt source-v4/part-06-1.txt source-v4/part-06-2.txt source-v4/part-07.txt > GeoShift-v4.b64
          /usr/bin/base64 -D < GeoShift-v4.b64 > GeoShift-v4.zip
          echo "a3c9fcf172d3c8c9cb02741ea652d68ae69d227bfbaee2456aecf0553293ae5c  GeoShift-v4.zip" | shasum -a 256 -c -
          unzip -t GeoShift-v4.zip
          rm -rf build-source
          mkdir build-source
          ditto -x -k GeoShift-v4.zip build-source
          test -d build-source/GeoShiftParity

      - name: Apply stable base fixes
        run: |
          python3 v4_hotfix.py build-source/GeoShiftParity

      - name: Apply original-style App Mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('build-source/GeoShiftParity')
          p = root / 'Core/bridge.go'
          s = p.read_text().replace('Addr: ":8888"', 'Addr: "127.0.0.1:8888"')
          p.write_text(s)
          p = root / 'Features/Setup/SetupFlowView.swift'
          s = p.read_text().replace('الخادم هو عنوان IP الخاص بالآيفون على الشبكة، والمنفذ 8888.', 'الخادم هو 127.0.0.1 والمنفذ 8888. لا تستخدم عنوان IP الخاص بالـ Wi-Fi.')
          p.write_text(s)
          p = root / 'Services/LocationProviders.swift'
          s = p.read_text().replace('تأكد من ضبط HTTP Proxy لشبكة Wi‑Fi على عنوان الآيفون والمنفذ 8888.', 'تأكد من ضبط HTTP Proxy للشبكة الحالية على 127.0.0.1 والمنفذ 8888.')
          p.write_text(s)
          PY

      - name: Apply v7.1 proxy preflight fix
        run: |
          python3 v71_proxy_preflight.py build-source/GeoShiftParity
          cd build-source/GeoShiftParity/Core
          gofmt -w main.go bridge.go

      - name: Validate sources
        run: |
          cd build-source/GeoShiftParity/Core
          go test ./...
          cd ..
          swiftc -parse App/*.swift Models/*.swift Services/*.swift Features/*/*.swift Utilities/*.swift Tests/*.swift

      - name: Build unsigned IPA
        run: |
          cd build-source/GeoShiftParity
          chmod +x build.sh BUILD_ON_MAC.command Scripts/*.sh
          ./build.sh
          test -s dist/GeoShift-unsigned.ipa
          cp dist/GeoShift-unsigned.ipa dist/GeoShift-v7.1-ProxyPreflight-Arabic-unsigned.ipa

      - name: Validate IPA
        run: |
          python3 - <<'PY'
          import zipfile, plistlib
          p='build-source/GeoShiftParity/dist/GeoShift-v7.1-ProxyPreflight-Arabic-unsigned.ipa'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              info=plistlib.loads(z.read('Payload/GeoShift.app/Info.plist'))
              exe=info.get('CFBundleExecutable')
              assert exe == 'GeoShift', exe
              assert f'Payload/GeoShift.app/{exe}' in names
              assert info.get('CFBundleShortVersionString') == '7.1.0', info.get('CFBundleShortVersionString')
              assert not any('/PlugIns/GeoShiftTunnel.appex/' in n for n in names)
              assert 'audio' in info.get('UIBackgroundModes', []), info.get('UIBackgroundModes')
              print('IPA validation OK:', info.get('CFBundleShortVersionString'), 'proxy preflight + background audio')
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-v7.1-ProxyPreflight-Arabic-unsigned-ipa
          path: build-source/GeoShiftParity/dist/GeoShift-v7.1-ProxyPreflight-Arabic-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Store IPA in repository
        run: |
          mkdir -p dist-releases
          cp build-source/GeoShiftParity/dist/GeoShift-v7.1-ProxyPreflight-Arabic-unsigned.ipa dist-releases/GeoShift-v7.1-ProxyPreflight-Arabic-unsigned.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-releases/GeoShift-v7.1-ProxyPreflight-Arabic-unsigned.ipa
          git commit -m "Add GeoShift v7.1 IPA" || true
          git push

      - name: Publish v7.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete geoshift-v7.1 --yes --cleanup-tag || true
          gh release create geoshift-v7.1 \
            build-source/GeoShiftParity/dist/GeoShift-v7.1-ProxyPreflight-Arabic-unsigned.ipa \
            --title "GeoShift v7.1 Proxy Preflight" \
            --notes "Adds a local 127.0.0.1:8888 preflight before enabling the Wi-Fi proxy, keeps the local core alive when leaving the app for Settings, and prevents setup from presenting manual-proxy steps before the embedded proxy is confirmed reachable."