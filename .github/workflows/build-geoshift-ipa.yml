name: Build GeoShift Parity IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - source-v4/**
      - .github/workflows/build-geoshift-ipa.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Reconstruct v4 source
        run: |
          cat source-v4/part-01.txt source-v4/part-02.txt source-v4/part-03.txt source-v4/part-04.txt source-v4/part-05.txt source-v4/part-06b.txt source-v4/part-07.txt > GeoShift-v4.b64
          /usr/bin/base64 -D < GeoShift-v4.b64 > GeoShift-v4.zip
          unzip -t GeoShift-v4.zip
          rm -rf build-source
          mkdir build-source
          ditto -x -k GeoShift-v4.zip build-source
          test -d build-source/GeoShiftParity

      - name: Validate sources
        run: |
          cd build-source/GeoShiftParity/Core
          go test ./...
          cd ..
          swiftc -parse App/*.swift Models/*.swift Services/*.swift Features/*/*.swift Utilities/*.swift Tests/*.swift

      - name: Build unsigned IPA
        run: |
          cd build-source/GeoShiftParity
          chmod +x build.sh BUILD_ON_MAC.command Scripts/*.sh
          ./build.sh
          test -s dist/GeoShift-unsigned.ipa

      - name: Validate IPA
        run: |
          python3 - <<'PY'
          import zipfile, plistlib
          p='build-source/GeoShiftParity/dist/GeoShift-unsigned.ipa'
          with zipfile.ZipFile(p) as z:
              info=plistlib.loads(z.read('Payload/GeoShift.app/Info.plist'))
              exe=info.get('CFBundleExecutable')
              assert exe == 'GeoShift', exe
              assert f'Payload/GeoShift.app/{exe}' in z.namelist()
              assert info.get('CFBundleShortVersionString') == '3.0.0'
              print('IPA validation OK:', exe, info.get('CFBundleShortVersionString'))
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-v4-Parity-Arabic-unsigned-ipa
          path: build-source/GeoShiftParity/dist/GeoShift-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
