name: Build GeoShift IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - source-parts/**
      - .github/workflows/build-geoshift-ipa.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Reconstruct and extract source
        run: |
          cat source-parts/part-01.txt source-parts/part-02.txt source-parts/part-03.txt source-parts/part-04.txt source-parts/part-05.txt source-parts/part-06a.txt source-parts/part-06b.txt | /usr/bin/base64 -D > GeoShift-source-fixed.zip
          unzip -t GeoShift-source-fixed.zip
          rm -rf build-source
          mkdir build-source
          ditto -x -k GeoShift-source-fixed.zip build-source
          test -d build-source/GeoShiftParity

      - name: Build unsigned IPA
        run: |
          cd build-source/GeoShiftParity
          chmod +x build.sh BUILD_ON_MAC.command Scripts/*.sh
          ./build.sh
          test -s dist/GeoShift-unsigned.ipa

      - name: Publish readable source tree
        run: |
          rm -rf source
          mkdir -p source
          ditto build-source/GeoShiftParity source/GeoShiftParity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          if ! git diff --cached --quiet; then
            git commit -m "Publish GeoShift source tree"
            git push
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-unsigned-ipa
          path: build-source/GeoShiftParity/dist/GeoShift-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
