name: Build GeoShift IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - source-parts/**
      - .github/workflows/build-geoshift-ipa.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Reconstruct and extract source
        run: |
          cat source-parts/part-01.txt source-parts/part-02.txt source-parts/part-03.txt source-parts/part-04.txt source-parts/part-05.txt > GeoShift-source.b64
          cat source-parts/part-06a1.txt >> GeoShift-source.b64
          head -c 661 source-parts/part-06a21.txt >> GeoShift-source.b64
          cat source-parts/part-06a21-fix.txt >> GeoShift-source.b64
          tail -c 8 source-parts/part-06a21.txt >> GeoShift-source.b64
          cat source-parts/part-06a22.txt source-parts/part-06b.txt >> GeoShift-source.b64
          /usr/bin/base64 -D < GeoShift-source.b64 > GeoShift-source-fixed.zip
          unzip -t GeoShift-source-fixed.zip
          rm -rf build-source
          mkdir build-source
          ditto -x -k GeoShift-source-fixed.zip build-source
          test -d build-source/GeoShiftParity

      - name: Apply Swift and plist fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          p = Path('build-source/GeoShiftParity/Features/Settings/DiagnosticsScreen.swift')
          s = p.read_text()
          s = s.replace('    static func make(store: AppStore) -> String {', '    @MainActor\n    static func make(store: AppStore) -> String {')
          p.write_text(s)

          p = Path('build-source/GeoShiftParity/Services/RealtimeLocationService.swift')
          s = p.read_text()
          s = s.replace('final class RealtimeLocationService: NSObject, ObservableObject, CLLocationManagerDelegate {', 'final class RealtimeLocationService: NSObject, ObservableObject, @preconcurrency CLLocationManagerDelegate {')
          p.write_text(s)

          p = Path('build-source/GeoShiftParity/Models/GeoModels.swift')
          s = p.read_text()
          s = s.replace('''        case .gcj02:\n            let wgs = CoordinateConverter.gcj02ToWGS84(mapPoint)\n            self.wgs84 = wgs\n            self.gcj02 = mapPoint''', '''        case .gcj02:\n            let wgs = CoordinateConverter.gcj02ToWGS84(mapPoint)\n            self.init(wgs84: wgs)\n            self.gcj02 = mapPoint''')
          p.write_text(s)

          p = Path('build-source/GeoShiftParity/Resources/Info.plist')
          with p.open('rb') as f:
              d = plistlib.load(f)
          d['CFBundleExecutable'] = '$(EXECUTABLE_NAME)'
          with p.open('wb') as f:
              plistlib.dump(d, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

      - name: Build unsigned IPA
        run: |
          cd build-source/GeoShiftParity
          chmod +x build.sh BUILD_ON_MAC.command Scripts/*.sh
          ./build.sh
          test -s dist/GeoShift-unsigned.ipa

      - name: Validate IPA
        run: |
          python3 - <<'PY'
          import zipfile, plistlib
          p='build-source/GeoShiftParity/dist/GeoShift-unsigned.ipa'
          with zipfile.ZipFile(p) as z:
              info=plistlib.loads(z.read('Payload/GeoShift.app/Info.plist'))
              exe=info.get('CFBundleExecutable')
              assert exe == 'GeoShift', exe
              assert f'Payload/GeoShift.app/{exe}' in z.namelist()
              print('IPA validation OK:', exe)
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-unsigned-ipa
          path: build-source/GeoShiftParity/dist/GeoShift-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
