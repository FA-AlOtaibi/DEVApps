name: Build GeoShift v6 Shadowrocket IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - source-v4/**
      - v4_hotfix.py
      - v6_shadowrocket.py
      - .github/workflows/build-geoshift-ipa.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Reconstruct v4 source
        run: |
          cat source-v4/part-01.txt source-v4/part-02.txt source-v4/part-03.txt source-v4/part-04.txt source-v4/part-05.txt source-v4/part-06-0.txt source-v4/part-06-1.txt source-v4/part-06-2.txt source-v4/part-07.txt > GeoShift-v4.b64
          /usr/bin/base64 -D < GeoShift-v4.b64 > GeoShift-v4.zip
          echo "a3c9fcf172d3c8c9cb02741ea652d68ae69d227bfbaee2456aecf0553293ae5c  GeoShift-v4.zip" | shasum -a 256 -c -
          unzip -t GeoShift-v4.zip
          rm -rf build-source
          mkdir build-source
          ditto -x -k GeoShift-v4.zip build-source
          test -d build-source/GeoShiftParity

      - name: Apply stable base fixes
        run: |
          python3 v4_hotfix.py build-source/GeoShiftParity
          cd build-source/GeoShiftParity/Core
          gofmt -w main.go

      - name: Apply v6 Shadowrocket mode
        run: |
          python3 v6_shadowrocket.py build-source/GeoShiftParity
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-source/GeoShiftParity/project.yml')
          s=p.read_text().replace('MARKETING_VERSION: "3.0.0"','MARKETING_VERSION: "6.0.0"').replace('CURRENT_PROJECT_VERSION: "30"','CURRENT_PROJECT_VERSION: "60"')
          p.write_text(s)
          PY

      - name: Validate sources
        run: |
          cd build-source/GeoShiftParity/Core
          go test ./...
          cd ..
          swiftc -parse App/*.swift Models/*.swift Services/*.swift Features/*/*.swift Utilities/*.swift Tests/*.swift

      - name: Build unsigned IPA
        run: |
          cd build-source/GeoShiftParity
          chmod +x build.sh BUILD_ON_MAC.command Scripts/*.sh
          ./build.sh
          test -s dist/GeoShift-unsigned.ipa

      - name: Validate IPA
        run: |
          python3 - <<'PY'
          import zipfile, plistlib
          p='build-source/GeoShiftParity/dist/GeoShift-unsigned.ipa'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              info=plistlib.loads(z.read('Payload/GeoShift.app/Info.plist'))
              exe=info.get('CFBundleExecutable')
              assert exe == 'GeoShift', exe
              assert f'Payload/GeoShift.app/{exe}' in names
              assert info.get('CFBundleShortVersionString') == '6.0.0', info.get('CFBundleShortVersionString')
              assert not any('/PlugIns/GeoShiftTunnel.appex/' in n for n in names), 'v6 should not contain Network Extension'
              print('IPA validation OK:', info.get('CFBundleShortVersionString'), 'no Network Extension')
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-v6-Shadowrocket-WLOC-Arabic-unsigned-ipa
          path: build-source/GeoShiftParity/dist/GeoShift-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
